  linters:
    name: "Server: Linters 📝"
    timeout-minutes: 15
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "server/pyproject.toml"

      - name: 🔧 uv install
        working-directory: ./server
        run: uv sync --dev --frozen

      - name: 🐶 Lint Server (ruff)
        working-directory: ./server
        run: uv run task lint_check

      - name: 🛟 Type Check Server (mypy)
        working-directory: ./server
        run: uv run task lint_types

  test:
    name: "Server: Tests 🐍"
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 15
    env:
      POLAR_ENV: testing
      POLAR_EMAIL_RENDERER_BINARY_PATH: ${{ github.workspace }}/server/emails/bin/react-email-pkg
      REGISTRY_USERNAME: x-token
      REGISTRY_PASSWORD: ${{ secrets.POLAR_TEST_TOKEN }}
      # PYTEST_XDIST_AUTO_NUM_WORKERS: "8"

    services:
      postgres:
        image: postgres:15.1-bullseye
        env:
          POSTGRES_USER: polar
          POSTGRES_PASSWORD: polar
          POSTGRES_DB: polar_test
          POSTGRES_PORT: 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

      minio:
        image: bitnamilegacy/minio:2024.5.28
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: polar
          MINIO_ROOT_PASSWORD: polarpolar
        options: >-
          --health-cmd "curl -I http://127.0.0.1:9000/minio/health/live"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

      tinybird:
        image: tinybirdco/tinybird-local:latest
        ports:
          - 7181:7181
          - 7182:7182
        options: >-
          --health-cmd "curl -s http://127.0.0.1:7181/tokens || exit 1"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v6

      - name: lscpu
        run: lscpu
      - name: docker info
        run: |
          cat /etc/docker/daemon.json || true

      - name: 💿 MinIO Setup
        working-directory: ./server/.minio
        env:
          MINIO_HOST: 127.0.0.1
          MINIO_ROOT_USER: polar
          MINIO_ROOT_PASSWORD: polarpolar
          ACCESS_KEY: polar-development
          SECRET_ACCESS_KEY: polar123456789
          BUCKET_NAME: polar-s3
          BUCKET_TESTING_NAME: testing-polar-s3
          POLICY_FILE: policy.json
        run: bash github.sh

      - uses: pnpm/action-setup@v6.0.8
        with:
          package_json_file: server/emails/package.json

      - name: 📬 Setup Node.js environment for server/emails
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: server/emails/.node-version
          cache: "pnpm"
          cache-dependency-path: "clients/pnpm-lock.yaml"

      - name: 📬 Build server/emails
        working-directory: server/emails
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "server/pyproject.toml"

      - name: Cache CJK fonts
        id: cjk-fonts-cache
        uses: actions/cache@v5
        with:
          path: /usr/share/fonts/opentype/noto
          key: cjk-fonts-${{ runner.os }}-noto-cjk-v1

      - name: Install CJK fonts
        if: steps.cjk-fonts-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 🔧 uv install
        working-directory: ./server
        run: |
          uv sync --dev --frozen
          uv run task generate_dev_jwks

      - name: 🐦 Install Tinybird CLI
        run: curl -sSL https://tinybird.co/install.sh | bash && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: ⚗️ alembic migrate
        working-directory: ./server
        run: uv run task db_migrate

      - name: ⚗️ alembic check
        working-directory: ./server
        run: uv run alembic check

      - name: 🐍 Run tests (pytest)
        working-directory: ./server
        run: uv run pytest -n auto --dist=loadgroup --no-cov --durations=0
